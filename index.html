<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./css/main.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <script type="module" src="./javascript/script.js"></script>
  <title>filter_page</title>
</head>
<body>
  <div class="container">
  <header class="setting-header">
    <h1 class="page-header-text"> Settings </h1>
    <div class="setting-header-buttons">
      <button class="save-create-button">Create setting</button>
    </div>
  </header>
  <div class="tabs">
    <div class="tabs__tab">All Settings</div>
    <div class="tabs__tab active-tab">Published</div>
    <div class="tabs__tab">BTC</div>
    <div class="tabs__tab">USDT</div>
    <div class="tabs__tab">TON</div>
  </div>
  <div id="empty-state" class="setting-empty-state">
    <img src="../icons/empty-page.svg" alt="Empty page">
    <span>Oopsie, seems that you have no formulas yet</span>
    <span>Create your first setting!</span>
    <button id="setting-add-formula-button">+</button>
  </div>
  <table class="table-no-spacing" cellspacing="0">
    <thead class="table-head">
      <tr class="table-row">
        <th class="cell cell-header-text active-cell"> Setting name</th>
        <th class="cell cell-header-text thead-status"> <div> Status </div> </th>
        <th class="cell cell-header-text"></th>
      </tr>
    </thead>
    <tbody id="table-body">
    </tbody>
  </table>
  </div>
</body>
</html>
